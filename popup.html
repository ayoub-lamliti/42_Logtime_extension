<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logtime Companion</title>
    <style>
        :root {
            --bg:        #09090f;
            --card:      #13131f;
            --card2:     #1c1c2c;
            --border:    rgba(255,255,255,0.06);
            --border-em: rgba(122,97,255,0.3);
            --fg:        #ffffff;
            --muted:     #6b6b80;
            --muted2:    #4a4a5c;
            --accent:    #7a61ff;
            --accent-s:  #9b85ff;
            --accent-bg: rgba(122,97,255,0.12);
            --warn:      #ff9f0a;
            --warn-bg:   rgba(255,159,10,0.12);
            --danger:    #ff453a;
            --danger-bg: rgba(255,69,58,0.12);
            --mono: ui-monospace,'Cascadia Code','Menlo','Consolas',monospace;
            --sans: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
            --circ: 452;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 320px;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            font-size: 13px;
            line-height: 1.5;
            user-select: none;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .p-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 14px 16px 12px;
        }

        .p-logo {
            width: 32px;
            height: 32px;
            background: var(--accent);
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            flex-shrink: 0;
        }

        .p-title-group { display: flex; flex-direction: column; }
        .p-title { font-size: 14px; font-weight: 600; letter-spacing: -0.01em; }
        .p-subtitle { font-size: 11px; color: var(--muted); }

        .p-status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid var(--border);
            background: var(--card);
            font-size: 11px;
            color: var(--muted);
        }

        .p-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
        }
        .p-status-dot.offline { background: var(--muted2); }
        .p-status-dot.error   { background: var(--danger); }

        /* ── VIEWS ── */
        .p-view { display: none; flex-direction: column; }
        .p-view.active { display: flex; }

        /* ── RING HERO CARD ── */
        .hero-card {
            margin: 0 12px 10px;
            background: var(--card);
            border-radius: 20px;
            border: 1px solid var(--border);
            padding: 24px 20px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .ring-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            margin-bottom: 16px;
        }

        .ring-svg {
            width: 160px;
            height: 160px;
            transform: rotate(-90deg);
        }

        .ring-bg-circle {
            fill: none;
            stroke: var(--card2);
            stroke-width: 14;
        }

        .ring-arc {
            fill: none;
            stroke: var(--accent);
            stroke-width: 14;
            stroke-linecap: round;
            stroke-dasharray: 452;
            stroke-dashoffset: 452;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4,0,0.2,1),
                        stroke 0.3s ease;
        }

        .ring-center {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .ring-hours {
            font-family: var(--mono);
            font-size: 38px;
            font-weight: 700;
            letter-spacing: -2px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .ring-goal {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
        }

        .hero-status {
            font-size: 12px;
            color: var(--muted);
            text-align: center;
            line-height: 1.5;
        }

        .hero-status .accent  { color: var(--accent-s);  font-weight: 600; }
        .hero-status .warn    { color: var(--warn);   font-weight: 600; }
        .hero-status .danger  { color: var(--danger); font-weight: 600; }

        /* hidden JS target for progress */
        .prog-hidden { display: none; }
        .prog-fill { width: 0%; }
        .prog-fill.warn   { background: var(--warn); }
        .prog-fill.danger { background: var(--danger); }

        /* ── COUNTDOWN CARDS ── */
        .section-wrap {
            margin: 0 12px 10px;
        }

        .section-label {
            font-size: 11px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--muted);
            margin-bottom: 8px;
            padding-left: 2px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .cd-cell {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 8px 10px;
            text-align: center;
        }

        .cd-val {
            font-family: var(--mono);
            font-size: 24px;
            font-weight: 700;
            display: block;
            line-height: 1;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        #t-days { color: var(--accent-s); }

        .cd-unit {
            display: block;
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 5px;
        }

        /* ── SELECT ── */
        .select-wrap {
            position: relative;
        }

        .p-select {
            width: 100%;
            background: var(--card);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 13px;
            font-family: var(--sans);
            appearance: none;
            cursor: pointer;
        }

        .p-select:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-bg);
        }

        .select-chevron {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--muted);
        }

        /* ── ACTIONS ── */
        .actions-wrap {
            margin: 0 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            width: 100%;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 14px;
            padding: 13px;
            font-size: 14px;
            font-weight: 600;
            font-family: var(--sans);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: opacity 0.15s, transform 0.1s;
        }

        .btn:hover  { opacity: 0.88; }
        .btn:active { transform: scale(0.98); opacity: 0.8; }

        .p-btn-refresh { background: var(--accent); }

        .p-btn-logout {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 12px;
            font-family: var(--sans);
            cursor: pointer;
            padding: 4px 0 6px;
            text-align: center;
            width: 100%;
            transition: color 0.15s;
        }

        .p-btn-logout:hover { color: var(--danger); }

        /* ── OTHER VIEWS ── */
        .p-loading, .p-auth, .p-error {
            padding: 48px 24px;
            text-align: center;
            align-items: center;
        }

        .p-spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--card2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text { color: var(--muted); font-size: 13px; }

        /* Auth */
        .p-auth-icon {
            width: 52px;
            height: 52px;
            background: var(--accent-bg);
            border: 1px solid var(--border-em);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        .p-auth-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }

        .p-auth-desc {
            color: var(--muted);
            font-size: 12px;
            margin-bottom: 24px;
            line-height: 1.6;
        }

        .p-btn-connect {
            background: var(--accent);
            color: #fff;
        }

        /* Error */
        .p-error-icon {
            width: 52px;
            height: 52px;
            background: var(--danger-bg);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
            color: var(--danger);
        }

        .p-error-title { font-size: 16px; font-weight: 600; margin-bottom: 8px; }

        .p-error-msg {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 20px;
            word-break: break-word;
            line-height: 1.6;
            padding: 10px 12px;
            background: var(--card);
            border-radius: 10px;
            font-family: var(--mono);
        }

        .p-btn-retry {
            background: var(--card2);
            border: 1px solid var(--border-em);
            color: var(--fg);
        }

        .p-btn-retry:hover { opacity: 0.8; }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="p-header">
        <div class="p-logo">42</div>
        <div class="p-title-group">
            <div class="p-title">Logtime</div>
            <div class="p-subtitle">42 School tracker</div>
        </div>
        <div class="p-status-pill">
            <div class="p-status-dot offline" id="status-dot"></div>
            <span id="status-label">Offline</span>
        </div>
    </div>

    <!-- LOADING -->
    <div class="p-view p-loading" id="view-loading">
        <div class="p-spinner"></div>
        <span class="loading-text">Fetching your hours…</span>
    </div>

    <!-- AUTH -->
    <div class="p-view p-auth" id="view-auth">
        <div class="p-auth-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:var(--accent)">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <p class="p-auth-title">Sign in to continue</p>
        <p class="p-auth-desc">Connect your 42 Intra account to start tracking your logtime.</p>
        <button class="btn p-btn-connect">Connect to 42 Intra</button>
    </div>

    <!-- MAIN -->
    <div class="p-view p-main" id="view-main">

        <!-- Hidden prog-fill target (JS compatibility) -->
        <div class="prog-hidden">
            <div class="prog-fill" id="prog-fill"></div>
        </div>

        <!-- Ring card -->
        <div class="hero-card">
            <div class="ring-wrap">
                <svg class="ring-svg" viewBox="0 0 160 160">
                    <circle class="ring-bg-circle" cx="80" cy="80" r="72"/>
                    <circle class="ring-arc" id="ring-arc" cx="80" cy="80" r="72"/>
                </svg>
                <div class="ring-center">
                    <span class="ring-hours" id="h-value">0.0</span>
                    <span class="ring-goal">of 30h</span>
                </div>
            </div>
            <p class="hero-status" id="prog-status">Calculating…</p>
        </div>

        <!-- Countdown -->
        <div class="section-wrap">
            <div class="section-label">Week ends in</div>
            <div class="countdown-grid">
                <div class="cd-cell">
                    <span class="cd-val" id="t-days">--</span>
                    <span class="cd-unit">Days</span>
                </div>
                <div class="cd-cell">
                    <span class="cd-val" id="t-hours">--</span>
                    <span class="cd-unit">Hours</span>
                </div>
                <div class="cd-cell">
                    <span class="cd-val" id="t-mins">--</span>
                    <span class="cd-unit">Mins</span>
                </div>
            </div>
        </div>

        <!-- Week start -->
        <div class="section-wrap">
            <div class="section-label">Week starts on</div>
            <div class="select-wrap">
                <select class="p-select" id="week-start">
                    <option value="0">Sunday</option>
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                </select>
                <svg class="select-chevron" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M6 9l6 6 6-6"/>
                </svg>
            </div>
        </div>

        <!-- Actions -->
        <div class="actions-wrap">
            <button class="btn p-btn-refresh">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Refresh
            </button>
            <button class="p-btn-logout">Sign out</button>
        </div>

    </div>

    <!-- ERROR -->
    <div class="p-view p-error" id="view-error">
        <div class="p-error-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <p class="p-error-title">Something went wrong</p>
        <p class="p-error-msg" id="error-msg"></p>
        <button class="btn p-btn-retry">Try again</button>
    </div>

    <script src="ring-sync.js"></script>
    <script src="popup.js"></script>
</body>
</html>

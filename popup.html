<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logtime Companion</title>
    <style>
        :root {
            --bg:        #151929;
            --card:      #1c2138;
            --card2:     #232b45;
            --border:    rgba(255,255,255,0.06);
            --fg:        #ffffff;
            --muted:     #6b7399;
            --muted2:    #3d4466;
            --accent:    #4f8ef7;
            --accent-bg: rgba(79,142,247,0.12);
            --green:     #22c55e;
            --green-bg:  rgba(34,197,94,0.12);
            --red:       #ff4d6a;
            --red-bg:    rgba(255,77,106,0.12);
            --warn:      #ff9f0a;
            --mono: ui-monospace,'Cascadia Code','Menlo','Consolas',monospace;
            --sans: -apple-system,BlinkMacSystemFont,'Segoe UI','Helvetica Neue',sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            width: 380px;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            font-size: 12px;
            line-height: 1.4;
            user-select: none;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .p-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
        }

        .p-logo {
            width: 28px; height: 28px;
            background: var(--accent);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-family: var(--mono);
            font-size: 12px; font-weight: 700; color: #fff;
            flex-shrink: 0;
        }

        .p-title    { font-size: 13px; font-weight: 600; }
        .p-subtitle { font-size: 10px; color: var(--muted); }

        .p-status-pill {
            margin-left: auto;
            display: flex; align-items: center; gap: 5px;
            padding: 3px 9px;
            border-radius: 20px;
            border: 1px solid var(--border);
            font-size: 10px; color: var(--muted);
        }

        .p-status-dot {
            width: 5px; height: 5px;
            border-radius: 50%; background: var(--green);
        }
        .p-status-dot.offline { background: var(--muted2); }
        .p-status-dot.error   { background: var(--red); }

        /* ── VIEWS ── */
        .p-view { display: none; flex-direction: column; }
        .p-view.active { display: flex; }

        /* ── TODAY CARD ── */
        .today-card {
            margin: 14px 14px 8px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: border-color 0.3s ease;
        }

        /* FIX: border reflects pace — connected to week card visually */
        .today-card.on-track  { border-color: rgba(34,197,94,0.25); }
        .today-card.behind    { border-color: rgba(255,77,106,0.25); }

        .today-left { display: flex; flex-direction: column; gap: 6px; }

        .section-label {
            font-size: 9px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: var(--muted);
        }

        .today-hours { display: flex; align-items: baseline; gap: 3px; }

        .today-num {
            font-family: var(--mono);
            font-size: 42px; font-weight: 700;
            line-height: 1; letter-spacing: -2px;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
            -webkit-font-smoothing: antialiased;
        }

        .today-unit {
            font-size: 16px; font-weight: 500;
            color: var(--muted); margin-bottom: 3px;
        }

        .today-right {
            display: flex; flex-direction: column;
            align-items: flex-end; gap: 6px;
        }

        .badge {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 4px 9px; border-radius: 20px;
            font-size: 10px; font-weight: 600;
        }

        .badge.blue  { background: var(--accent-bg); color: var(--accent); }
        .badge.green { background: var(--green-bg);  color: var(--green);  }
        .badge.red   { background: var(--red-bg);    color: var(--red);    }

        /* FIX: target label slightly more prominent */
        .target-label {
            font-size: 11px;
            color: var(--muted);
        }

        /* ── WEEK CARD ── */
        .week-card {
            margin: 0 14px 10px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .week-top {
            width: 100%;
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 16px;
        }

        /* ── RING ── */
        .ring-wrap {
            position: relative;
            width: 140px; height: 140px;
            margin-bottom: 18px;
        }

        .ring-svg { width: 140px; height: 140px; transform: rotate(-90deg); }

        .ring-bg-circle { fill: none; stroke: var(--card2); stroke-width: 11; }

        .ring-arc {
            fill: none;
            stroke: var(--accent);
            stroke-width: 11;
            stroke-linecap: round;
            stroke-dasharray: 395;
            stroke-dashoffset: 395;
            transition: stroke-dashoffset 0.5s cubic-bezier(0.4,0,0.2,1),
                        stroke 0.3s ease;
        }

        .ring-center {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        .ring-hours {
            font-family: var(--mono);
            font-size: 30px; font-weight: 700;
            line-height: 1; letter-spacing: -1px;
            font-variant-numeric: tabular-nums;
            font-feature-settings: "tnum";
        }

        .ring-goal { font-size: 10px; color: var(--muted); margin-top: 3px; }

        /* ── WEEK STATS ── */
        .week-stats {
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1px 1fr;
        }

        .stat-divider { background: var(--border); }

        .stat-block { text-align: center; padding: 0 12px; }

        .stat-label {
            font-size: 9px; font-weight: 600;
            letter-spacing: 0.08em; text-transform: uppercase;
            color: var(--muted); margin-bottom: 4px;
        }

        .stat-val {
            font-family: var(--mono);
            font-size: 20px; font-weight: 700;
            font-variant-numeric: tabular-nums;
        }

        /* FIX: status colors only applied by JS, not hardcoded red */
        .stat-val.green { color: var(--green); }
        .stat-val.red   { color: var(--red); }
        .stat-val.warn  { color: var(--warn); }

        /* ── BOTTOM STRIP — FIX: select + refresh only, sign out moved out ── */
        .bottom-strip {
            border-top: 1px solid var(--border);
            padding: 10px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group { display: flex; align-items: center; gap: 7px; flex: 1; }
        .input-group label { font-size: 10px; color: var(--muted); white-space: nowrap; }

        .select-wrap { position: relative; flex: 1; }

        .p-select {
            width: 100%;
            background: var(--card2);
            color: var(--fg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 0 24px 0 10px;
            height: 34px;
            font-size: 11px;
            letter-spacing: 0.01em;
            font-family: var(--sans);
            appearance: none; cursor: pointer;
        }

        .p-select:focus { outline: none; border-color: var(--accent); }

        .select-chevron {
            position: absolute; right: 7px; top: 50%;
            transform: translateY(-50%);
            pointer-events: none; color: var(--muted);
        }

        .btn {
            background: var(--accent);
            color: #fff; border: none;
            border-radius: 8px;
            padding: 7px 13px;
            font-size: 11px; font-weight: 600;
            font-family: var(--sans);
            cursor: pointer;
            display: flex; align-items: center; gap: 5px;
            transition: opacity 0.15s;
            white-space: nowrap;
        }

        .btn:hover  { opacity: 0.85; }
        .btn:active { opacity: 0.70; }

        .p-btn-refresh {
            min-width: 110px;
            min-height: 34px;
            font-size: 11px;
            letter-spacing: 0.01em;
        }

        /* Spinner inside a button — must be inline-flex, no margin */
        .btn-spinner {
            display: inline-flex;
            width: 13px;
            height: 13px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            flex-shrink: 0;
        }
        .signout-row {
            padding: 0 14px 12px;
            display: flex;
            justify-content: center;
        }

        .p-btn-logout {
            background: none; border: none;
            color: var(--muted);
            font-size: 11px; font-family: var(--sans);
            cursor: pointer; padding: 4px 12px;
            transition: color 0.15s;
        }
        .p-btn-logout:hover { color: var(--red); }

        #prog-status { display: none; }
        .prog-hidden { display: none; }
        .prog-fill   { width: 0%; }

        /* ── OTHER VIEWS ── */
        .p-loading, .p-auth, .p-error {
            padding: 48px 24px;
            text-align: center; align-items: center;
        }

        .p-spinner {
            width: 26px; height: 26px;
            border: 3px solid var(--card2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
        .loading-text { color: var(--muted); font-size: 12px; }

        .state-icon {
            width: 48px; height: 48px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            margin: 0 auto 16px;
        }

        .state-title  { font-size: 15px; font-weight: 600; margin-bottom: 8px; }
        .p-auth-desc  { color: var(--muted); font-size: 12px; margin-bottom: 22px; line-height: 1.6; }
        .p-btn-connect { width: 100%; justify-content: center; }

        .p-error-title { font-size: 15px; font-weight: 600; margin-bottom: 8px; }

        .p-error-msg {
            color: var(--muted); font-size: 11px; margin-bottom: 20px;
            word-break: break-word; line-height: 1.6;
            padding: 10px 12px; background: var(--card);
            border-radius: 8px; font-family: var(--mono); width: 100%;
        }

        .p-btn-retry { background: var(--card2); border: 1px solid var(--border); color: var(--fg); }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="p-header">
        <div class="p-logo">42</div>
        <div>
            <div class="p-title">Logtime</div>
            <div class="p-subtitle">42 School tracker</div>
        </div>
        <div class="p-status-pill">
            <div class="p-status-dot offline" id="status-dot"></div>
            <span id="status-label">Offline</span>
        </div>
    </div>

    <!-- LOADING -->
    <div class="p-view p-loading" id="view-loading">
        <div class="p-spinner"></div>
        <span class="loading-text">Fetching your hours…</span>
    </div>

    <!-- AUTH -->
    <div class="p-view p-auth" id="view-auth">
        <div class="state-icon" style="background:var(--accent-bg)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <p class="state-title">Sign in to continue</p>
        <p class="p-auth-desc">Connect your 42 Intra account to start tracking your logtime.</p>
        <button class="btn p-btn-connect">Connect to 42 Intra</button>
    </div>

    <!-- MAIN -->
    <div class="p-view p-main" id="view-main">

        <!-- JS compat hooks -->
        <div class="prog-hidden">
            <div class="prog-fill" id="prog-fill"></div>
        </div>
        <p id="prog-status"></p>
        <span style="display:none" id="t-hours"></span>
        <span style="display:none" id="t-mins"></span>

        <!-- TODAY -->
        <div class="today-card" id="today-card">
            <div class="today-left">
                <span class="section-label">Today</span>
                <div class="today-hours">
                    <span class="today-num" id="today-value">0</span>
                    <span class="today-unit">h</span>
                </div>
                <!-- FIX: target populated by popup.js via today-target -->
                <span class="target-label" id="today-target">Target: --</span>
            </div>
            <div class="today-right">
                <!-- FIX: label clarified to "Daily goal" -->
                <div class="badge blue" id="today-est">
                    <svg width="9" height="9" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    Daily goal
                </div>
            </div>
        </div>

        <!-- THIS WEEK -->
        <div class="week-card">
            <div class="week-top">
                <span class="section-label">This week</span>
            </div>

            <div class="ring-wrap">
                <svg class="ring-svg" viewBox="0 0 140 140">
                    <circle class="ring-bg-circle" cx="70" cy="70" r="63"/>
                    <circle class="ring-arc" id="ring-arc" cx="70" cy="70" r="63"/>
                </svg>
                <div class="ring-center">
                    <span class="ring-hours" id="h-value">0h</span>
                    <span class="ring-goal">of 30h</span>
                </div>
            </div>

            <div class="week-stats">
                <!-- FIX: "Days left" instead of ambiguous "Days" -->
                <div class="stat-block">
                    <div class="stat-label">Days left</div>
                    <div class="stat-val" id="t-days">--</div>
                </div>
                <div class="stat-divider"></div>
                <!-- FIX: status set by JS dynamically, no hardcoded red -->
                <div class="stat-block">
                    <div class="stat-label">Pace</div>
                    <div class="stat-val" id="week-status">--</div>
                </div>
            </div>
        </div>

        <!-- BOTTOM: FIX — "Week starts on" restored, sign out moved below -->
        <div class="bottom-strip">
            <div class="input-group">
                <label for="week-start">Week starts on</label>
                <div class="select-wrap">
                    <select class="p-select" id="week-start">
                        <option value="0">Sunday</option>
                        <option value="1">Monday</option>
                        <option value="2">Tuesday</option>
                        <option value="3">Wednesday</option>
                        <option value="4">Thursday</option>
                        <option value="5">Friday</option>
                        <option value="6">Saturday</option>
                    </select>
                    <svg class="select-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                        <path d="M6 9l6 6 6-6"/>
                    </svg>
                </div>
            </div>
            <button class="btn p-btn-refresh">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Refresh
            </button>
        </div>

        <!-- FIX: sign out on its own row, not competing with controls -->
        <div class="signout-row">
            <button class="p-btn-logout">Sign out</button>
        </div>

    </div>

    <!-- ERROR -->
    <div class="p-view p-error" id="view-error">
        <div class="state-icon" style="background:var(--red-bg)">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="var(--red)" stroke-width="2">
                <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <p class="p-error-title">Something went wrong</p>
        <p class="p-error-msg" id="error-msg"></p>
        <button class="btn p-btn-retry">Try again</button>
    </div>

    <script src="ring-sync.js"></script>
    <script src="popup.js"></script>
</body>
</html>

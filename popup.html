<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Logtime Companion</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --bg:        #0d0d0d;
            --surface:   #161616;
            --surface2:  #1e1e1e;
            --border:    rgba(255,255,255,0.07);
            --border-em: rgba(255,255,255,0.13);
            --fg:        #f2f2f2;
            --muted:     #686868;
            --subtle:    #3a3a3a;
            --accent:    #22c55e;
            --accent-dim:#14532d;
            --warn:      #f59e0b;
            --warn-dim:  #451a03;
            --danger:    #ef4444;
            --danger-dim:#450a0a;
            --mono:      'JetBrains Mono', monospace;
            --sans:      'Inter', system-ui, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            width: 320px;
            background: var(--bg);
            color: var(--fg);
            font-family: var(--sans);
            font-size: 12px;
            line-height: 1.5;
            user-select: none;
            overflow: hidden;
        }

        /* ── HEADER ── */
        .p-header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 11px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--surface);
        }

        .p-logo {
            width: 28px;
            height: 28px;
            background: var(--accent);
            color: #000;
            font-family: var(--mono);
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            flex-shrink: 0;
        }

        .p-title-group {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .p-title {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
            color: var(--fg);
        }

        .p-subtitle {
            font-size: 10px;
            color: var(--muted);
        }

        .p-status-pill {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 5px;
            font-size: 10px;
            color: var(--muted);
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 3px 8px;
        }

        .p-status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            flex-shrink: 0;
        }

        .p-status-dot.offline { background: var(--subtle); }
        .p-status-dot.error   { background: var(--danger); }

        .p-status-pill .dot-label { color: var(--muted); }
        .p-status-pill .dot-label.live { color: var(--accent); }

        /* ── VIEWS ── */
        .p-view { display: none; flex-direction: column; }
        .p-view.active { display: flex; }

        /* ── HERO ── */
        .hero-section {
            padding: 20px 16px 18px;
            border-bottom: 1px solid var(--border);
        }

        .hero-label {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .hours-display {
            display: flex;
            align-items: baseline;
            gap: 6px;
            margin-bottom: 20px;
        }

        .hours-big {
            font-family: var(--mono);
            font-size: 52px;
            font-weight: 700;
            line-height: 1;
            color: var(--fg);
            letter-spacing: -2px;
        }

        .hours-of {
            font-family: var(--mono);
            font-size: 14px;
            color: var(--muted);
            font-weight: 500;
        }

        /* ── PROGRESS ── */
        .prog-wrap {
            position: relative;
        }

        .prog-bar-outer {
            width: 100%;
            height: 6px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
        }

        .prog-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
            border-radius: 99px;
            transition: width 0.3s ease;
        }

        .prog-fill.warn   { background: var(--warn); }
        .prog-fill.danger { background: var(--danger); }

        /* milestone ticks */
        .prog-ticks {
            position: relative;
            height: 10px;
            margin-top: 4px;
        }

        .prog-tick {
            position: absolute;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
        }

        .prog-tick .tick-line {
            width: 1px;
            height: 4px;
            background: var(--subtle);
        }

        .prog-tick .tick-val {
            font-family: var(--mono);
            font-size: 9px;
            color: var(--subtle);
        }

        .prog-status {
            margin-top: 14px;
            font-size: 11px;
            color: var(--muted);
        }

        .prog-status .accent  { color: var(--accent);  font-weight: 600; font-family: var(--mono); }
        .prog-status .warn    { color: var(--warn);    font-weight: 600; font-family: var(--mono); }
        .prog-status .danger  { color: var(--danger);  font-weight: 600; font-family: var(--mono); }

        /* ── COUNTDOWN ── */
        .secondary-section {
            padding: 16px;
            border-bottom: 1px solid var(--border);
        }

        .section-label {
            font-size: 10px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .countdown-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-bottom: 16px;
        }

        .countdown-cell {
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 8px 8px;
            text-align: center;
        }

        .countdown-val {
            font-family: var(--mono);
            font-size: 22px;
            font-weight: 700;
            color: var(--fg);
            display: block;
            line-height: 1;
        }

        .countdown-unit {
            font-size: 9px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 4px;
            display: block;
        }

        /* ── SELECT ── */
        .input-group label {
            display: block;
            font-size: 10px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .p-select {
            width: 100%;
            background: var(--surface2);
            color: var(--fg);
            border: 1px solid var(--border-em);
            border-radius: 7px;
            padding: 8px 10px;
            font-size: 12px;
            font-family: var(--sans);
            appearance: none;
            cursor: pointer;
        }

        .p-select:focus {
            border-color: var(--accent);
            outline: 2px solid rgba(34,197,94,0.2);
        }

        /* ── ACTIONS ── */
        .p-actions {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .btn {
            background: var(--surface2);
            color: var(--fg);
            border: 1px solid var(--border-em);
            border-radius: 7px;
            padding: 10px;
            font-size: 12px;
            font-weight: 500;
            font-family: var(--sans);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            transition: background 0.1s, border-color 0.1s;
        }

        .btn:hover { background: var(--surface); border-color: var(--border-em); }

        .btn-icon {
            width: 14px;
            height: 14px;
            opacity: 0.6;
        }

        .p-btn-refresh:hover { border-color: var(--accent); color: var(--accent); }

        .p-btn-logout {
            background: transparent;
            border: none;
            color: var(--muted);
            font-size: 11px;
            font-family: var(--sans);
            cursor: pointer;
            padding: 4px 0 8px;
            text-align: center;
            width: 100%;
            transition: color 0.1s;
        }

        .p-btn-logout:hover { color: var(--danger); }

        /* ── OTHER VIEWS ── */
        .p-loading, .p-auth, .p-error {
            padding: 40px 24px;
            text-align: center;
            align-items: center;
        }

        .p-spinner {
            width: 22px;
            height: 22px;
            border: 2px solid var(--surface2);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin-bottom: 14px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            color: var(--muted);
            font-size: 11px;
        }

        /* Auth */
        .p-auth-icon {
            width: 40px;
            height: 40px;
            background: var(--surface2);
            border: 1px solid var(--border-em);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
        }

        .p-auth-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .p-auth-desc {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 20px;
            line-height: 1.6;
        }

        .p-btn-connect {
            border-color: var(--accent);
            color: var(--accent);
        }

        .p-btn-connect:hover {
            background: rgba(34,197,94,0.08);
        }

        /* Error */
        .p-error-icon {
            color: var(--danger);
            background: var(--danger-dim);
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 14px;
        }

        .p-error-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .p-error-msg {
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 20px;
            word-break: break-word;
            line-height: 1.6;
            padding: 10px;
            background: var(--surface2);
            border-radius: 7px;
            font-family: var(--mono);
        }

        .p-btn-retry {
            border-color: var(--border-em);
        }

        .p-btn-retry:hover {
            border-color: var(--fg);
            color: var(--fg);
        }
    </style>
</head>
<body>

    <!-- HEADER -->
    <div class="p-header">
        <div class="p-logo">42</div>
        <div class="p-title-group">
            <div class="p-title">Logtime</div>
            <div class="p-subtitle">42 School tracker</div>
        </div>
        <div class="p-status-pill">
            <div class="p-status-dot offline" id="status-dot"></div>
            <span class="dot-label" id="status-label">Offline</span>
        </div>
    </div>

    <!-- LOADING -->
    <div class="p-view p-loading" id="view-loading">
        <div class="p-spinner"></div>
        <span class="loading-text">Fetching your hours…</span>
    </div>

    <!-- AUTH -->
    <div class="p-view p-auth" id="view-auth">
        <div class="p-auth-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color: var(--muted)">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
        </div>
        <p class="p-auth-title">Sign in to continue</p>
        <p class="p-auth-desc">Connect your 42 Intra account to start tracking your logtime.</p>
        <button class="btn p-btn-connect">Connect to 42 Intra</button>
    </div>

    <!-- MAIN -->
    <div class="p-view p-main" id="view-main">

        <!-- Hero: hours -->
        <div class="hero-section">
            <div class="hero-label">Hours logged this week</div>
            <div class="hours-display">
                <span class="hours-big" id="h-value">0.0</span>
                <span class="hours-of">/ 30h</span>
            </div>

            <!-- Progress bar -->
            <div class="prog-wrap">
                <div class="prog-bar-outer">
                    <div class="prog-fill" id="prog-fill"></div>
                </div>
                <div class="prog-ticks">
                    <div class="prog-tick" style="left:66.7%">
                        <div class="tick-line"></div>
                        <div class="tick-val">20h</div>
                    </div>
                    <div class="prog-tick" style="left:83.3%">
                        <div class="tick-line"></div>
                        <div class="tick-val">25h</div>
                    </div>
                </div>
            </div>

            <p class="prog-status" id="prog-status">Calculating…</p>
        </div>

        <!-- Countdown + settings -->
        <div class="secondary-section">
            <div class="section-label">Week ends in</div>
            <div class="countdown-grid">
                <div class="countdown-cell">
                    <span class="countdown-val" id="t-days">--</span>
                    <span class="countdown-unit">Days</span>
                </div>
                <div class="countdown-cell">
                    <span class="countdown-val" id="t-hours">--</span>
                    <span class="countdown-unit">Hours</span>
                </div>
                <div class="countdown-cell">
                    <span class="countdown-val" id="t-mins">--</span>
                    <span class="countdown-unit">Minutes</span>
                </div>
            </div>

            <div class="input-group">
                <label for="week-start">Week starts on</label>
                <select class="p-select" id="week-start">
                    <option value="0">Sunday</option>
                    <option value="1">Monday</option>
                    <option value="2">Tuesday</option>
                    <option value="3">Wednesday</option>
                    <option value="4">Thursday</option>
                    <option value="5">Friday</option>
                    <option value="6">Saturday</option>
                </select>
            </div>
        </div>

        <!-- Actions -->
        <div class="p-actions">
            <button class="btn p-btn-refresh">
                <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6"/><path d="M1 20v-6h6"/>
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
                </svg>
                Refresh
            </button>
            <button class="p-btn-logout">Sign out</button>
        </div>

    </div>

    <!-- ERROR -->
    <div class="p-view p-error" id="view-error">
        <div class="p-error-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
        </div>
        <p class="p-error-title">Something went wrong</p>
        <p class="p-error-msg" id="error-msg"></p>
        <button class="btn p-btn-retry">Try again</button>
    </div>

    <script src="popup.js"></script>
</body>
</html>
